name: Weekly AI UX & Test Evolver

on:
  schedule:
    - cron: '30 20 * * 3' # Every Wednesday 02:15 AM Nepal Time
  workflow_dispatch:
    inputs:
      mode:
        description: "Weekly evolution focus"
        type: choice
        default: auto
        options:
          - auto
          - regression_tests
          - ux_accessibility

permissions:
  contents: write

concurrency:
  group: weekly-evolver
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Evolve Tests & Accessibility Polish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_OPTIMIZER_MODEL: ${{ vars.GEMINI_OPTIMIZER_MODEL }}
          MODE: ${{ inputs.mode || 'auto' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import os, glob, json, time, random, subprocess
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key:
              print("GEMINI_API_KEY secret is not configured; skipping run cleanly.")
              exit(0)

          client = genai.Client(api_key=api_key)
          mode = os.environ.get("MODE", "auto").strip()
          if mode == "auto":
              run_num = int(os.environ.get("RUN_NUMBER", "0") or "0")
              mode = "regression_tests" if run_num % 2 == 0 else "ux_accessibility"

          recent_commits = subprocess.check_output(
              ["git", "log", "-n", "10", "--oneline"], text=True
          ).strip()

          if mode == "regression_tests":
              source_candidates = sorted(glob.glob("app/src/main/java/**/*.kt", recursive=True))
              test_candidates = sorted(glob.glob("app/src/test/java/**/*.kt", recursive=True))
              picked_src = random.choice(source_candidates)
              picked_test = test_candidates[0] if test_candidates else ""
              files_payload = {picked_src: open(picked_src, encoding="utf-8").read()}
              if picked_test:
                  files_payload[picked_test] = open(picked_test, encoding="utf-8").read()
              goal = (
                  "Write 1-2 valuable JUnit/Robolectric regression tests covering untested edge cases in the provided source file. "
                  "Add them via a surgical `search` -> `replace` edit in the test file (never delete existing tests)."
              )
          else:
              ui_files = sorted(glob.glob("app/src/main/java/com/example/ui/**/*.kt", recursive=True))
              picked = random.sample(ui_files, min(2, len(ui_files)))
              files_payload = {p: open(p, encoding="utf-8").read() for p in picked}
              goal = (
                  "Improve Material 3 UI ergonomics, keyboard/TalkBack contentDescriptions, 48dp minimum touch targets, "
                  "or tablet responsiveness using targeted `search` -> `replace` edits."
              )

          prompt = f"""
          You are maintaining Mochi Reader (Android Kotlin + Jetpack Compose + Robolectric).
          Weekly Mission ({mode}): {goal}

          Recent Commits:
          {recent_commits}

          Rules:
          - Return ONLY valid JSON matching:
            {{
              "summary": "short imperative summary under 65 chars",
              "edits": [
                {{"path": "exact/path.kt", "search": "exact unique substring", "replace": "improved replacement"}}
              ]
            }}
          - Preserve all public APIs, Room schemas, and testTags.
          - If no meaningful improvement is needed, return {{"summary": "none", "edits": []}}.

          Files:
          {json.dumps(files_payload)}
          """

          custom_model = os.environ.get("GEMINI_OPTIMIZER_MODEL", "").strip()
          candidates = [m for m in [custom_model, "gemini-2.5-pro", "gemini-2.5-flash"] if m]
          response = None
          for m in candidates:
              try:
                  response = client.models.generate_content(
                      model=m,
                      contents=prompt,
                      config=types.GenerateContentConfig(response_mime_type="application/json", temperature=0.2)
                  )
                  break
              except Exception as e:
                  print(f"{m} error: {e}")
                  time.sleep(2)

          if response is None or not getattr(response, "text", None):
              exit(0)

          result = json.loads(response.text)
          applied = 0
          for edit in result.get("edits", []):
              path = edit.get("path", "")
              search = edit.get("search", "")
              replace = edit.get("replace", "")
              if path not in files_payload or not path.startswith("app/src/") or not search or search == replace:
                  continue
              cur = open(path, encoding="utf-8").read()
              if cur.count(search) != 1:
                  continue
              with open(path, "w", encoding="utf-8") as f:
                  f.write(cur.replace(search, replace, 1))
              applied += 1

          if applied > 0:
              summary = (result.get("summary") or f"weekly {mode}").strip().splitlines()[0][:72]
              with open(".ai_weekly_msg", "w", encoding="utf-8") as f:
                  f.write(summary)
          EOF

      - name: Update Rolling Changelog if Commits Accrued
        run: |
          MAJOR=$(grep -E '^VERSION_MAJOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          MINOR=$(grep -E '^VERSION_MINOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          PATCH_BASE=$(grep -E '^VERSION_PATCH_BASE=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          NEXT_VER="${MAJOR:-1}.${MINOR:-1}.$(( ${PATCH_BASE:-0} + COMMIT_COUNT + 1 ))"
          RECENT=$(git log -n 12 --pretty=format:"- %s (\`%h\`)" --no-merges)
          if [ ! -f CHANGELOG.md ] || [ -f .ai_weekly_msg ]; then
            {
              echo "# Mochi Reader Changelog"
              echo ""
              echo "## v${NEXT_VER} (Automated Snapshot)"
              echo "$RECENT"
            } > CHANGELOG.md
          fi

      - name: Verify Build & Tests
        id: verify
        run: |
          if [ -n "$(git status --porcelain app/src/ CHANGELOG.md)" ]; then
            if gradle testDebugUnitTest; then
              echo "valid=true" >> $GITHUB_OUTPUT
            else
              echo "Verification failed! Reverting changes."
              git checkout -- .
              rm -f .ai_weekly_msg
              echo "valid=false" >> $GITHUB_OUTPUT
            fi
          else
            rm -f .ai_weekly_msg
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push Weekly Evolution
        if: steps.verify.outputs.valid == 'true'
        run: |
          git config user.name "Mochi Weekly Evolver"
          git config user.email "actions@github.com"
          git add app/src/ CHANGELOG.md
          MSG=$( [ -f .ai_weekly_msg ] && cat .ai_weekly_msg || echo "refresh rolling changelog and polish" )
          rm -f .ai_weekly_msg
          git commit -m "chore(ai): $MSG"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
