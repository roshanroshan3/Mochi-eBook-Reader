name: PR Verification & AI Code Review

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-and-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests, Lint & Debug Build
        run: gradle testDebugUnitTest lintDebug assembleDebug

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-reports-${{ github.event.pull_request.number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Set up Python for AI PR Review
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google GenAI SDK
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        run: pip install google-genai

      - name: Generate AI Engineering Review
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        id: ai_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - << 'EOF'
          import os, subprocess
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key:
              exit(0)

          base_ref = os.environ.get("BASE_REF", "main")
          diff = subprocess.check_output(
              ["git", "diff", f"origin/{base_ref}...HEAD", "--", "app/src/"],
              text=True,
              errors="replace"
          )
          if not diff.strip():
              print("No app/src diff to review.")
              exit(0)

          diff = diff[:38000]
          client = genai.Client(api_key=api_key)
          prompt = f"""
          Review this Android (Kotlin + Jetpack Compose + Room) PR diff for Mochi Reader.
          Focus strictly on concrete issues:
          1. Memory/OOM risks (unbounded Bitmaps, unrecycled buffers, large allocations in draw/scroll).
          2. Compose recomposition bugs or gesture conflicts.
          3. Play Store policy or security bugs (broad storage permissions, leaked secrets, zip-slip).
          4. Missing test coverage for changed logic.
          Keep your response concise (max 10 bullet points) with exact file names. If everything looks solid, say so cleanly.

          Diff:
          {diff}
          """

          review = None
          for model in ["gemini-2.5-flash", "gemini-2.5-flash-lite"]:
              try:
                  resp = client.models.generate_content(model=model, contents=prompt)
                  if getattr(resp, "text", None):
                      review = resp.text.strip()
                      break
              except Exception as e:
                  print(f"{model} failed: {e}")

          if review:
              with open("ai_pr_review.md", "w", encoding="utf-8") as f:
                  f.write("### Mochi AI PR Review\n\n" + review[:12000])
          EOF

      - name: Post AI Review Comment on PR
        if: ${{ hashFiles('ai_pr_review.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ai_pr_review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
