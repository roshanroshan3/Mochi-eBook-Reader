name: Build & Publish Release APK

on:
  push:
    branches: [ main, master ]
  workflow_run:
    workflows:
      - "AI Code Scrutiny & Optimizer (Every 2 Days)"
      - "Weekly AI UX & Test Evolver"
    types:
      - completed
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional custom version name override (e.g. 1.2.0)"
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub Release as pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute Version & Check Release State
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -f version.properties ]; then
            MAJOR=$(grep -E '^VERSION_MAJOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
            MINOR=$(grep -E '^VERSION_MINOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
            PATCH_BASE=$(grep -E '^VERSION_PATCH_BASE=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          fi
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-1}
          PATCH_BASE=${PATCH_BASE:-0}

          COMMIT_COUNT=$(git rev-list --count HEAD)
          PATCH=$((PATCH_BASE + COMMIT_COUNT))

          if [ -n "$INPUT_VERSION_NAME" ]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
          else
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          fi
          VERSION_CODE=$((MAJOR * 100000 + MINOR * 10000 + PATCH))
          TAG_NAME="v${VERSION_NAME}"

          SKIP_RELEASE="false"
          if [ "$EVENT_NAME" = "workflow_run" ] && git tag --points-at HEAD | grep -qE '^v[0-9]'; then
            SKIP_RELEASE="true"
            echo "HEAD already has a release tag and optimizer made no new commits; skipping duplicate build."
          fi

          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "skip_release=${SKIP_RELEASE}" >> $GITHUB_OUTPUT
          echo "Resolved Mochi Reader v${VERSION_NAME} (versionCode=${VERSION_CODE}, tag=${TAG_NAME})"

      - name: Set up JDK 21
        if: steps.version.outputs.skip_release != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.version.outputs.skip_release != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Release Signing Keystore
        if: steps.version.outputs.skip_release != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Using repository secret RELEASE_KEYSTORE_BASE64..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "CI_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}" >> $GITHUB_ENV
            echo "CI_KEY_ALIAS=${RELEASE_KEY_ALIAS:-upload}" >> $GITHUB_ENV
            echo "CI_KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}" >> $GITHUB_ENV
          elif [ -f debug.keystore.base64 ]; then
            echo "Using deterministic repo keystore (debug.keystore.base64) so updates install seamlessly without signature mismatch."
            base64 -d debug.keystore.base64 > my-upload-key.jks
            echo "CI_STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "CI_KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "CI_KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "Generating fallback upload keystore..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass android \
              -alias upload \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Mochi Reader,O=Mochi,C=US"
            echo "CI_STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "CI_KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "CI_KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          cp my-upload-key.jks app/my-upload-key.jks

      - name: Run Unit & Robolectric Tests
        if: steps.version.outputs.skip_release != 'true'
        env:
          MOCHI_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          MOCHI_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          gradle testDebugUnitTest \
            -PmochiVersionCode="${MOCHI_VERSION_CODE}" \
            -PmochiVersionName="${MOCHI_VERSION_NAME}"

      - name: Build Versioned Release APK
        if: steps.version.outputs.skip_release != 'true'
        env:
          MOCHI_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          MOCHI_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          cat << 'EOF' > init-signing.gradle.kts
          allprojects {
            afterEvaluate {
              extensions.findByName("android")?.let { androidExt ->
                val signingConfigs = androidExt.javaClass.getMethod("getSigningConfigs").invoke(androidExt)
                val releaseConfig = signingConfigs.javaClass.getMethod("findByName", String::class.java).invoke(signingConfigs, "release")
                if (releaseConfig != null) {
                  releaseConfig.javaClass.getMethod("setStoreFile", java.io.File::class.java).invoke(releaseConfig, rootProject.file("my-upload-key.jks"))
                  releaseConfig.javaClass.getMethod("setStorePassword", String::class.java).invoke(releaseConfig, System.getenv("CI_STORE_PASSWORD") ?: "android")
                  releaseConfig.javaClass.getMethod("setKeyAlias", String::class.java).invoke(releaseConfig, System.getenv("CI_KEY_ALIAS") ?: "upload")
                  releaseConfig.javaClass.getMethod("setKeyPassword", String::class.java).invoke(releaseConfig, System.getenv("CI_KEY_PASSWORD") ?: "android")
                }
              }
            }
          }
          EOF
          gradle assembleRelease --init-script init-signing.gradle.kts \
            -PmochiVersionCode="${MOCHI_VERSION_CODE}" \
            -PmochiVersionName="${MOCHI_VERSION_NAME}"

      - name: Package Versioned APKs & Generate Changelog
        if: steps.version.outputs.skip_release != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi

          VERSIONED_APK="Mochi-Reader-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$VERSIONED_APK"
          cp app/build/outputs/apk/release/app-release.apk "Mochi-Reader.apk"
          echo "versioned_apk=${VERSIONED_APK}" >> $GITHUB_ENV

          PREV_TAG=$(git describe --tags --match 'v*' --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (\`%h\`)" -n 25)
          else
            CHANGES=$(git log --pretty=format:"- %s (\`%h\`)" -n 15)
          fi

          cat << EOF > release-notes.md
          ## Mochi Reader \`v${VERSION_NAME}\` (Build \`${VERSION_CODE}\`)

          - **Version Name:** \`${VERSION_NAME}\`
          - **Android versionCode:** \`${VERSION_CODE}\`
          - **Commit:** \`${{ github.sha }}\`
          - **Workflow Run:** #${{ github.run_number }}

          ### What's Changed
          ${CHANGES}

          ### Downloads
          - **\`${VERSIONED_APK}\`** — Versioned release build
          - **\`Mochi-Reader.apk\`** — Rolling latest APK filename
          EOF

          rm -f init-signing.gradle.kts my-upload-key.jks app/my-upload-key.jks

      - name: Upload Build Artifact
        if: steps.version.outputs.skip_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-Reader-v${{ steps.version.outputs.version_name }}
          path: |
            ${{ env.versioned_apk }}
            Mochi-Reader.apk
          retention-days: 30

      - name: Publish Versioned APK to GitHub Releases
        if: steps.version.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Mochi Reader v${{ steps.version.outputs.version_name }} (Build ${{ steps.version.outputs.version_code }})
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease == true }}
          files: |
            ${{ env.versioned_apk }}
            Mochi-Reader.apk
          overwrite_files: true
          make_latest: ${{ inputs.prerelease != true }}
